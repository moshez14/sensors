---
- name: Deploy and manage sensors server
  hosts: localhost
  become: yes
  vars:
    sensors_repo: "git@github.com:moshez14/sensors.git"
    sensors_dir: "/home/maifocus/sensors"
    sensors_user: "maifocus"
    sensors_group: "maifocus"
    venv_path: "{{ sensors_dir }}/venv"

  tasks:
    - name: Ensure sensors directory exists
      file:
        path: "{{ sensors_dir }}"
        state: directory
        owner: "{{ sensors_user }}"
        group: "{{ sensors_group }}"
        mode: '0755'

    - name: Fix git ownership issue
      file:
        path: "{{ sensors_dir }}/.git"
        recurse: yes
        owner: "{{ sensors_user }}"
        group: "{{ sensors_group }}"
      ignore_errors: yes

    - name: Add safe directory for git (root)
      command:
        cmd: "git config --global --add safe.directory {{ sensors_dir }}"
      environment:
        HOME: /root
      ignore_errors: yes

    - name: Add safe directory for git (sensors user)
      command:
        cmd: "git config --global --add safe.directory {{ sensors_dir }}"
      become_user: "{{ sensors_user }}"
      ignore_errors: yes

    - name: Clone/update sensors repository
      git:
        repo: "{{ sensors_repo }}"
        dest: "{{ sensors_dir }}"
        version: main
        update: yes
        force: yes

    - name: Fix sensors directory permissions
      file:
        path: "{{ sensors_dir }}"
        state: directory
        owner: "{{ sensors_user }}"
        group: "{{ sensors_group }}"
        mode: '0755'
        recurse: yes

    - name: Create Python virtual environment
      command:
        cmd: "python3.12 -m venv {{ venv_path }}"
        creates: "{{ venv_path }}/bin/python"

    - name: Fix venv permissions
      file:
        path: "{{ venv_path }}"
        owner: "{{ sensors_user }}"
        group: "{{ sensors_group }}"
        mode: '0755'
        recurse: yes

    - name: Install Python dependencies
      pip:
        requirements: "{{ sensors_dir }}/requirements.txt"
        virtualenv: "{{ venv_path }}"
        virtualenv_python: python3.12

    - name: Create systemd service for sensors
      copy:
        dest: /etc/systemd/system/sensors.service
        owner: root
        group: root
        mode: '0644'
        content: |
          [Unit]
          Description=Sensors Alert Server
          After=network.target
          
          [Service]
          Type=simple
          User={{ sensors_user }}
          Group={{ sensors_group }}
          WorkingDirectory={{ sensors_dir }}
          ExecStart={{ venv_path }}/bin/python3 server_sensor_alert.py
          Restart=always
          RestartSec=10
          
          [Install]
          WantedBy=multi-user.target
      notify: reload systemd

    - name: Enable and start sensors service
      systemd:
        name: sensors
        enabled: yes
        state: started
        daemon_reload: yes

    - name: Create git state enforcement script
      copy:
        dest: /usr/local/bin/enforce-sensors-state.sh
        owner: root
        group: root
        mode: '0755'
        content: |
          #!/bin/bash
          set -e
          
          SENSORS_DIR="{{ sensors_dir }}"
          SENSORS_USER="{{ sensors_user }}"
          REPO_URL="{{ sensors_repo }}"
          
          cd "$SENSORS_DIR"
          
          # Check for any changes (modified, deleted, or untracked files)
          if ! sudo -u $SENSORS_USER git status --porcelain 2>/dev/null | grep -q .; then
              exit 0  # No changes
          fi
          
          # Log the changes that were made
          echo "$(date): Detected changes in $SENSORS_DIR" >> /var/log/sensors-enforcement.log
          sudo -u $SENSORS_USER git status >> /var/log/sensors-enforcement.log 2>&1
          
          # Reset to original state
          echo "$(date): Restoring original configuration" >> /var/log/sensors-enforcement.log
          
          # Reset all changes (including deleted files)
          sudo -u $SENSORS_USER git reset --hard HEAD 2>/dev/null || true
          
          # Remove untracked files
          sudo -u $SENSORS_USER git clean -fd 2>/dev/null || true
          
          # Ensure service is running
          systemctl restart sensors
          
          echo "$(date): Sensors service restored" >> /var/log/sensors-enforcement.log

    - name: Create service health check script
      copy:
        dest: /usr/local/bin/ensure-sensors-running.sh
        owner: root
        group: root
        mode: '0755'
        content: |
          #!/bin/bash
          
          SERVICE_NAME="sensors"
          
          # Check if service is running
          if ! systemctl is-active --quiet $SERVICE_NAME; then
              echo "$(date): Service $SERVICE_NAME is not running, starting it..." >> /var/log/sensors-enforcement.log
              systemctl start $SERVICE_NAME
              echo "$(date): Service $SERVICE_NAME started" >> /var/log/sensors-enforcement.log
          fi

    - name: Create monitoring cron job (enforce git state every 5 minutes)
      cron:
        name: "Sensors git state enforcement"
        minute: "*/5"
        hour: "*"
        job: "/usr/local/bin/enforce-sensors-state.sh"
        user: root
        state: present

    - name: Create health check cron job (ensure service is running every minute)
      cron:
        name: "Sensors service health check"
        minute: "*"
        hour: "*"
        job: "/usr/local/bin/ensure-sensors-running.sh"
        user: root
        state: present

  handlers:
    - name: reload systemd
      systemd:
        daemon_reload: yes
